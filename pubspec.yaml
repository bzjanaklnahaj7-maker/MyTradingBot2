name: alking
description: "Alking - Trading Bot"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  device_info_plus: ^10.1.0
  flutter_inappwebview: ^6.0.0
  permission_handler: ^11.3.0
  candlesticks: ^2.1.0
  intl: ^0.19.0
  flutter_foreground_task: ^8.10.0
  flutter_local_notifications: ^17.0.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logoo.jpeg
    - assets/intro.mp4
    - assets/ring.wav
